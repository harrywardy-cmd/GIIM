# Checks every pull request and every push to main: build, tests, lint, and the Azure templates.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release

  web:
    name: Web UI lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Giim.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Giim.Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  infra:
    name: Azure templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - run: az bicep lint --file infra/main.bicep
