# Local development dependencies. Start with:  docker compose up -d
# The SA password is a local-only development credential; never reuse it anywhere else.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: giim-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${GIIM_SQL_PASSWORD:-Giim-Dev-Passw0rd!}"
    ports:
      - "1433:1433"
    volumes:
      - giim-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  giim-sql-data:
